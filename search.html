<!doctype html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0b1020"
    >

    <title>
        Search Results — Suporly
    </title>

    <link
        rel="stylesheet"
        href="css/navigation.css"
    >

    <link
        rel="stylesheet"
        href="css/search.css"
    >
    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body data-theme="light">
  <div id="pageLoader" class="page-loader">
      <div class="page-loader-content">

          <img
              src="assets/logos/logo.png"
              class="page-loader-logo"
              alt="Suporly"
          >

          <div class="page-loader-spinner"></div>

      </div>
  </div>
  <script src="js/loader.js"></script>


<body>


<!-- =========================================================
     NAVIGATION
========================================================= -->


<header class="site-header">

<a
    class="brand"
    href="home.html"
>

    <img
    class="brand-logo"
    src="assets/logos/icon.png"
    alt="Suporly"
    >

    <span>
    Suporly
    </span>

</a>


<nav class="site-nav">

    <a href="home.html">
    Home
    </a>

    <a href="explore.html">
    Explore
    </a>

    <a href="saved.html">
    Saved
    </a>

</nav>


<div class="site-search">

    <span class="search-icon">
    ⌕
    </span>

    <input
    id="conversationSearch"
    type="search"
    placeholder="Search conversations..."
    autocomplete="off"
    aria-label="Search conversations"
    >

</div>


<a
    class="new-conversation-button active"
    href="new.html"
>

    <span class="new-conversation-icon">
    +
    </span>

    <span>
    New
    </span>

</a>


<div class="site-actions">

    <!-- THEME -->

    <div class="theme-menu">
    <button
        class="theme-menu-button"
        id="themeMenuButton"
        type="button"
        aria-haspopup="true"
        aria-expanded="false"
    >

        <span
            class="theme-menu-icon"
            id="themeMenuIcon"
        >
            ☀
        </span>

        <span id="themeMenuLabel">
            Light
        </span>

        <span class="theme-menu-arrow">
            ▾
        </span>

    </button>


    <div
        class="theme-menu-dropdown"
        id="themeMenuDropdown"
    >

        <button
        class="theme-option"
        data-theme="light"
        type="button"
        >
        <span>☀</span>
        <span>Light</span>
        </button>


        <button
        class="theme-option"
        data-theme="dark"
        type="button"
        >
        <span>◐</span>
        <span>Dark</span>
        </button>


        <button
        class="theme-option"
        data-theme="suporly"
        type="button"
        >
        <span>✦</span>
        <span>Suporly</span>
        </button>

    </div>

    </div>


    <!-- ACCOUNT -->

    <a
        class="account-button"
        href="profile.html"
    >

        <div class="account-user-info">

            <span
                class="account-displayname"
                id="accountDisplayname"
            >
                Account
            </span>

            <div
                class="account-badges"
                id="accountBadges"
            ></div>

        </div>

        <img
            class="profile-icon"
            id="profileIcon"
            src="assets/temp/default_pfp.png"
            alt="Profile"
        >

    </a>

</div>

</header>
<body>

<main class="search-page">

    <header class="search-header">

        <h1>Search</h1>

        <p id="searchQueryLabel">
            Results for "help"
        </p>

    </header>


    <nav class="search-tabs">

        <button
            class="search-tab active"
            data-search-tab="conversations"
            type="button"
        >
            Conversations
        </button>

        <button
            class="search-tab"
            data-search-tab="profiles"
            type="button"
        >
            Profiles
        </button>

    </nav>


    <section
        class="search-panel"
        id="conversationResults"
    >

        <div class="search-toolbar">

            <span>
                Conversations
            </span>

            <div class="search-sort">

                <button
                    class="search-sort-button"
                    id="conversationSortButton"
                    type="button"
                    aria-haspopup="true"
                    aria-expanded="false"
                >

                    <span class="search-sort-icon">
                        ↕
                    </span>

                    <span
                        class="search-sort-value"
                        id="conversationSortValue"
                    >
                        Newest
                    </span>

                    <span class="search-sort-arrow">
                        ▾
                    </span>

                </button>


                <div
                    class="search-sort-dropdown"
                    id="conversationSortDropdown"
                >

                    <button
                        class="search-sort-option active"
                        type="button"
                        data-sort="newest"
                    >

                        <span class="search-sort-option-icon">
                            ↓
                        </span>

                        <span>
                            Newest
                        </span>

                    </button>


                    <button
                        class="search-sort-option"
                        type="button"
                        data-sort="oldest"
                    >

                        <span class="search-sort-option-icon">
                            ↑
                        </span>

                        <span>
                            Oldest
                        </span>

                    </button>


                    <button
                        class="search-sort-option"
                        type="button"
                        data-sort="replies"
                    >

                        <span class="search-sort-option-icon">
                            ◌
                        </span>

                        <span>
                            Most replies
                        </span>

                    </button>


                    <button
                        class="search-sort-option"
                        type="button"
                        data-sort="reputation"
                    >

                        <span class="search-sort-option-icon">
                            ✦
                        </span>

                        <span>
                            Most reputation
                        </span>

                    </button>

                </div>

            </div>

        </div>


        <div
            class="conversation-search-list"
            id="conversationSearchList"
        ></div>


        <button
            class="search-load-more"
            id="conversationLoadMore"
            type="button"
        >
            Load more
        </button>

    </section>


    <section
        class="search-panel"
        id="profileResults"
        hidden
    >

        <div class="profile-search-list"
             id="profileSearchList">
        </div>

    </section>

    <script src="js/session.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/search.js"></script>
</main>

</body>

</html>
