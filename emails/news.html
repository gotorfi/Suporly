<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} — Suporly</title>
</head>

<body style="
  margin:0;
  padding:0;
  background:#f4f5f7;
  font-family:Arial, Helvetica, sans-serif;
  color:#111318;
">

  <table
    role="presentation"
    width="100%"
    cellspacing="0"
    cellpadding="0"
    border="0"
    style="background:#f4f5f7;"
  >
    <tr>
      <td align="center" style="padding:40px 16px;">

        <table
          role="presentation"
          width="100%"
          cellspacing="0"
          cellpadding="0"
          border="0"
          style="
            max-width:560px;
            background:#ffffff;
            border:1px solid #e5e7eb;
            border-radius:16px;
            overflow:hidden;
          "
        >

          <!-- Header -->
          <tr>
            <td
              align="center"
              style="
                padding:30px;
                border-bottom:1px solid #e5e7eb;
              "
            >

              <img
                src="{{LOGO_URL}}"
                width="46"
                height="46"
                alt="Suporly"
                style="
                  display:block;
                  width:46px;
                  height:46px;
                  border-radius:11px;
                  margin-bottom:14px;
                "
              >

              <div style="
                font-size:17px;
                font-weight:800;
                letter-spacing:-0.5px;
                color:#111318;
              ">
                Suporly
              </div>

            </td>
          </tr>


          <!-- Hero -->
          <tr>
            <td style="padding:38px 36px 30px;">

              <div style="
                font-size:10px;
                font-weight:800;
                letter-spacing:2px;
                color:#7d78ff;
                text-transform:uppercase;
                margin-bottom:10px;
              ">
                SUPORLY NEWS
              </div>

              <h1 style="
                margin:0;
                font-size:30px;
                line-height:1.15;
                letter-spacing:-1px;
                color:#111318;
              ">
                {{TITLE}}
              </h1>

              <p style="
                margin:13px 0 0;
                font-size:13px;
                line-height:1.7;
                color:#6b7280;
              ">
                {{SUBTITLE}}
              </p>

            </td>
          </tr>


          <!-- Image -->
          <tr>
            <td style="padding:0 36px;">

              <img
                src="{{IMAGE_URL}}"
                width="488"
                alt="{{TITLE}}"
                style="
                  display:block;
                  width:100%;
                  max-width:488px;
                  height:auto;
                  border-radius:12px;
                  border:1px solid #e5e7eb;
                "
              >

            </td>
          </tr>


          <!-- Content -->
          <tr>
            <td style="padding:30px 36px 36px;">

              <div style="
                font-size:13px;
                line-height:1.8;
                color:#4b5563;
              ">
                {{CONTENT}}
              </div>


              <!-- Button -->
              <table
                role="presentation"
                cellspacing="0"
                cellpadding="0"
                border="0"
                style="margin-top:28px;"
              >
                <tr>
                  <td
                    align="center"
                    style="
                      border-radius:10px;
                      background:#111318;
                    "
                  >

                    <a
                      href="{{URL}}"
                      style="
                        display:inline-block;
                        padding:13px 19px;
                        color:#ffffff;
                        text-decoration:none;
                        font-size:12px;
                        font-weight:700;
                        border-radius:10px;
                      "
                    >
                      Read the update&nbsp; →
                    </a>

                  </td>
                </tr>
              </table>

            </td>
          </tr>


          <!-- Small message -->
          <tr>
            <td
              style="
                padding:22px 36px;
                background:#f8f9fa;
                border-top:1px solid #e5e7eb;
              "
            >

              <div style="
                font-size:11px;
                line-height:1.6;
                color:#7b818b;
              ">
                Thanks for being part of Suporly.
                We're building a better corner of the internet,
                one update at a time.
              </div>

            </td>
          </tr>


          <!-- Footer -->
          <tr>
            <td
              align="center"
              style="
                padding:20px 30px;
                background:#f8f9fa;
              "
            >

              <div style="
                font-size:10px;
                color:#a1a6ad;
              ">
                © 2026 Suporly | Made By GotorFI
              </div>

            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
