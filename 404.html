        src="assets/logos/error.png"
        alt=""

    <div class="error-heading">

      </span>

        Page Not Found

      </p>

    </div>


    <div class="error-actions">

      <a
        class="error-primary-btn"

        Back to Front-Page
      </a>

      <button
        class="error-secondary-btn"
